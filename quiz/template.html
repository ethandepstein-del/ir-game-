<title>Japan Map Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Shippori+Mincho:wght@600;800&display=swap">
<style>
  :root {
    --paper: #f2f4f1;
    --panel: #fbfcfa;
    --ocean: #d3e1e8;
    --stipple: #a6bfcd;
    --ocean-ink: #557789;
    --land: #fdfcf8;
    --land-2: #e8e6de;
    --coast: #4f5d69;
    --grid: #b0c4cf;
    --ink: #1b2631;
    --muted: #56656f;
    --faint: #8995a0;
    --line: #d3dade;
    --accent: #27477f;
    --accent-soft: #dfe6f3;
    --seal: #b8322a;
    --seal-soft: #f6dcd8;
    --ok: #2d7a4c;
    --ok-soft: #d8eee0;
    --warn: #a86d12;
    --halo: #fdfcf8;
    --sea-hl: rgba(39, 71, 127, .17);
    --sea-ok: rgba(45, 122, 76, .2);
    --sea-bad: rgba(184, 50, 42, .16);
    --band: rgba(39, 71, 127, .24);
    --band-ok: rgba(45, 122, 76, .3);
    --band-bad: rgba(184, 50, 42, .28);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0f151b; --panel: #151d25; --ocean: #13222d; --stipple: #213a4b; --ocean-ink: #7596aa;
      --land: #2b3641; --land-2: #202932; --coast: #8ea0ae; --grid: #1e3341;
      --ink: #e5eaee; --muted: #9aa9b4; --faint: #6d7c88; --line: #26323c;
      --accent: #93b2ee; --accent-soft: #1f2d45; --seal: #f07466; --seal-soft: #3d201d;
      --ok: #62c68f; --ok-soft: #173424; --warn: #e2a94d; --halo: #101820;
      --sea-hl: rgba(147, 178, 238, .18); --sea-ok: rgba(98, 198, 143, .18); --sea-bad: rgba(240, 116, 102, .16);
      --band: rgba(147, 178, 238, .3); --band-ok: rgba(98, 198, 143, .32); --band-bad: rgba(240, 116, 102, .32);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0f151b; --panel: #151d25; --ocean: #13222d; --stipple: #213a4b; --ocean-ink: #7596aa;
    --land: #2b3641; --land-2: #202932; --coast: #8ea0ae; --grid: #1e3341;
    --ink: #e5eaee; --muted: #9aa9b4; --faint: #6d7c88; --line: #26323c;
    --accent: #93b2ee; --accent-soft: #1f2d45; --seal: #f07466; --seal-soft: #3d201d;
    --ok: #62c68f; --ok-soft: #173424; --warn: #e2a94d; --halo: #101820;
    --sea-hl: rgba(147, 178, 238, .18); --sea-ok: rgba(98, 198, 143, .18); --sea-bad: rgba(240, 116, 102, .16);
    --band: rgba(147, 178, 238, .3); --band-ok: rgba(98, 198, 143, .32); --band-bad: rgba(240, 116, 102, .32);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); padding: 0 16px; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { max-width: 1180px; margin: 0 auto; padding-block: 16px 48px; display: grid; gap: 12px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .hanko { flex: none; width: 40px; height: 40px; border-radius: 7px; background: var(--seal); color: #fff; display: grid; place-items: center; font: 800 23px/1 var(--serif); transform: rotate(-4deg); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .2); }
  h1 { margin: 0; font: 800 clamp(22px, 4.2vw, 30px)/1.1 var(--serif); letter-spacing: .01em; text-wrap: balance; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  .modes { display: flex; gap: 3px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; scrollbar-width: none; }
  .modes button { flex: 1 0 auto; border: 0; background: none; padding: 8px 10px; border-radius: 7px; font-weight: 500; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .modes button[aria-selected="true"] { background: var(--accent); color: var(--panel); }
  .modes button:not([aria-selected="true"]):hover { color: var(--ink); background: var(--accent-soft); }

  .layout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 940px) {
    .layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
    .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; }
  }
  .stage { display: grid; gap: 10px; min-width: 0; }

  .prompt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 60px; }
  .prompt .grow { flex: 1 1 170px; min-width: 0; }
  .eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .target { font: 800 clamp(24px, 6vw, 36px)/1.1 var(--serif); text-wrap: balance; }
  .score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; line-height: 1.35; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .timer { font: 500 24px/1 var(--mono); font-variant-numeric: tabular-nums; padding: 7px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
  .timer.low { background: var(--seal-soft); color: var(--seal); }

  .btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 8px; font-weight: 500; font-size: 14px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .btn.warn { background: var(--seal); border-color: var(--seal); color: #fff; }

  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 6px 9px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg button:disabled { opacity: .55; }
  @media (max-width: 400px) { .seg .long { display: none; } }

  .mapwrap { --ar: 1; position: relative; width: min(100%, max(330px, calc((100vh - 290px) * var(--ar)))); margin-inline: auto; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--ocean); }
  @supports (height: 100svh) { .mapwrap { width: min(100%, max(330px, calc((100svh - 290px) * var(--ar)))); } }
  .mapwrap svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; cursor: crosshair; }
  .maptools { position: absolute; inset: 8px 8px auto 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 6px; pointer-events: none; }
  .maptools > * { pointer-events: auto; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .zoom button { width: 32px; font-size: 17px; line-height: 1; padding: 6px 0; }

  /* map */
  .ocean { fill: var(--ocean); }
  .stipple { pointer-events: none; }
  .stip { fill: var(--stipple); }
  .grid { fill: none; stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
  .sea { fill: transparent; transition: fill .2s; }
  .land { fill: var(--land-2); stroke: var(--coast); stroke-width: .8; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill .2s; }
  .land.jp { fill: var(--land); }
  .halo { fill: none; stroke: transparent; stroke-width: 18px; vector-effect: non-scaling-stroke; pointer-events: stroke; }
  .city { fill: var(--ink); stroke: var(--halo); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .ctxdot { fill: var(--panel); stroke: var(--coast); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
  .cap { fill: var(--coast); pointer-events: none; }
  .land.hl, .city.hl { fill: var(--accent); }
  .sea.hl { fill: var(--sea-hl); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
  .land.good, .city.good { fill: var(--ok); }
  .sea.good { fill: var(--sea-ok); stroke: var(--ok); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
  .land.bad, .city.bad { fill: var(--seal); }
  .sea.bad { fill: var(--sea-bad); }
  .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; pointer-events: none; }
  .ring.good { stroke: var(--ok); }
  .ring.bad { stroke: var(--seal); }
  .ring.pending { stroke-dasharray: 4 3; }
  .band { fill: none; stroke: var(--band); stroke-width: 22px; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; display: none; }
  .band.on { display: inline; }
  .band.good { stroke: var(--band-ok); }
  .band.bad { stroke: var(--band-bad); }
  .answer { animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .answer { animation: none; } }

  .lbl { font-family: var(--sans); font-weight: 600; fill: var(--ink); stroke: var(--halo); stroke-width: var(--hw, 3px); paint-order: stroke; stroke-linejoin: round; pointer-events: none; display: none; }
  .lbl.on, .lbl.ctx, .lbl.deg { display: inline; }
  .lbl.sea-l { fill: var(--accent); font-style: italic; font-weight: 500; stroke: var(--ocean); }
  .lbl.city-l { font-size: .94em; }
  .lbl.ctx { fill: var(--muted); font-weight: 500; font-size: .74em; }
  .lbl.ctx.water { fill: var(--ocean-ink); font-style: italic; stroke: var(--ocean); }
  .lbl.ctx.big { font-size: .9em; letter-spacing: .05em; }
  .lbl.ctx.caps { letter-spacing: .14em; font-size: .7em; }
  .lbl.deg { font-family: var(--mono); font-size: .56em; font-weight: 500; fill: var(--ocean-ink); stroke: var(--ocean); }
  .lbl.placed { font-weight: 700; }
  .lbl.ok { fill: var(--ok); }
  .lbl.no { fill: var(--seal); }
  .lbl.mine { fill: var(--accent); }
  .lbl.ghost { fill: var(--muted); font-weight: 500; }
  .lbl.struck { fill: var(--faint); font-weight: 500; }

  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .choices button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 11px 10px; font-weight: 600; font-size: 16px; text-align: left; display: flex; gap: 10px; align-items: center; min-height: 48px; }
  .choices kbd { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  .choices button:hover:not(:disabled) { border-color: var(--accent); }
  .choices button.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .choices button.wrong { background: var(--seal-soft); border-color: var(--seal); color: var(--seal); }

  .typeit { display: flex; gap: 8px; }
  .typeit input { flex: 1; min-width: 0; font: 600 17px var(--sans); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
  .typeit input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .typeit .btn { min-width: 76px; }

  .bank { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .bank-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); }
  .bank-head b { color: var(--ink); font-weight: 600; }
  .bank-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .bank-chips button { border: 1.5px dashed var(--coast); background: var(--land); border-radius: 6px; padding: 7px 11px; font-weight: 600; font-size: 14px; min-height: 38px; }
  .bank-chips button.placed { border: 1px solid var(--line); background: none; color: var(--faint); font-weight: 500; }
  .bank-chips button[aria-pressed="true"] { background: var(--accent); border: 1.5px solid var(--accent); color: var(--panel); }
  .bank-help { font-size: 13.5px; color: var(--muted); }
  .bank-help.nudge { color: var(--seal); }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; }
  .linkbtn:hover { text-decoration: underline; }

  .feedback { min-height: 48px; border-radius: 10px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .feedback .msg { flex: 1 1 240px; }
  .feedback .msg b { font-weight: 600; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
  .feedback.no { border-color: var(--seal); background: var(--seal-soft); }
  .hint { display: block; color: var(--muted); font-size: 13.5px; }
  .tag { font: 500 12px var(--mono); color: var(--muted); margin-left: 4px; }

  .results { display: grid; gap: 12px; width: 100%; }
  .results .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 20px; }
  .results h4 { margin: 0 0 4px; font: 600 11px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .results ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 14px; }
  .results li { display: flex; gap: 8px; align-items: baseline; }
  .results .v { color: var(--ok); font-weight: 700; }
  .results .x { color: var(--seal); font-weight: 700; }
  .results .why { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }

  .tricks { display: grid; gap: 10px; padding-top: 8px; }
  .tricks h2 { margin: 0; font: 800 21px/1.2 var(--serif); }
  .tricks .lede { margin: -4px 0 0; color: var(--muted); font-size: 14px; }
  .trick-grid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 620px) { .trick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .trick { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
  .trick h3 { margin: 0; font: 600 15px/1.3 var(--sans); }
  .trick p { margin: 0; color: var(--muted); font-size: 14px; }
  .trick .linkbtn { justify-self: start; margin-top: 2px; }
  .trick.active { border-color: var(--accent); background: var(--accent-soft); }
  .trick.active p { color: var(--ink); }

  .side { display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .side h2 { margin: 0 0 8px; font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .meter .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
  .meter .bar i { display: block; height: 100%; }
  .meter .txt { margin-top: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nextstep { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
  .nextstep p { margin: 0; font-size: 14px; }
  .nextstep .btn { justify-self: start; }
  .best { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .best b { color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 11px; font-size: 13px; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .chips button:disabled { opacity: .45; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .cat { display: grid; gap: 1px; }
  .cat h3 { margin: 6px 0 2px; font: 600 13px/1.3 var(--sans); display: flex; justify-content: space-between; }
  .cat h3 span { color: var(--muted); font-weight: 400; }
  .item { display: flex; align-items: center; gap: 9px; border: 0; background: none; text-align: left; padding: 5px 6px; border-radius: 6px; width: 100%; }
  .item:hover { background: var(--accent-soft); }
  .pip { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--line); }
  .pip.s1 { background: var(--warn); }
  .pip.s2 { background: var(--ok); }
  .pip.miss { background: var(--seal); }
  .item .n { flex: 1; }
  .item .r { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .reset { justify-self: start; border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 0; }
</style>

<div class="app">
  <header class="top">
    <div class="hanko" aria-hidden="true">地</div>
    <div>
      <h1>Japan Map Quiz</h1>
      <p class="sub">25 places · 2 maps · 10 minutes</p>
    </div>
  </header>

  <nav class="modes" role="tablist" aria-label="Mode">
    <button role="tab" data-mode="study" aria-selected="true">Study</button>
    <button role="tab" data-mode="find" aria-selected="false">Find it</button>
    <button role="tab" data-mode="name" aria-selected="false">Name it</button>
    <button role="tab" data-mode="mock" aria-selected="false">Mock quiz</button>
  </nav>

  <div class="layout">
    <section class="stage">
      <div class="prompt" id="prompt"></div>
      <div class="mapwrap" id="mapwrap">
        <div class="maptools">
          <div class="seg" id="viewseg" role="group" aria-label="Map">
            <button data-view="japan" aria-pressed="true"><span class="long">Map 1 · </span>Japan</button>
            <button data-view="region" aria-pressed="false"><span class="long">Map 2 · </span>East Asia</button>
          </div>
          <div class="seg zoom" role="group" aria-label="Zoom">
            <button id="z-in" aria-label="Zoom in">+</button>
            <button id="z-out" aria-label="Zoom out">−</button>
            <button id="z-reset" aria-label="Show the whole map">⟲</button>
          </div>
        </div>
      </div>
      <div class="choices" id="choices" hidden></div>
      <form class="typeit" id="typeit" hidden autocomplete="off">
        <label class="sr" for="type-in">Name of the highlighted place</label>
        <input id="type-in" type="text" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Type the name">
        <button class="btn primary" id="type-go" type="submit">Check</button>
      </form>
      <div class="bank" id="bank" hidden></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <section class="tricks" id="tricks">
        <h2>Memory tricks</h2>
        <p class="lede">Tap “Show on map” to light up the places each trick covers.</p>
        <div class="trick-grid" id="trick-grid"></div>
      </section>
    </section>

    <aside class="side">
      <div class="meter" id="meter"></div>
      <div class="nextstep" id="nextstep"></div>
      <div class="best" id="best"></div>
      <div id="setbox" hidden><h2>Practice set</h2><div class="chips" id="chips"></div></div>
      <div class="legend">
        <span><i class="pip"></i>new</span>
        <span><i class="pip miss"></i>missed last time</span>
        <span><i class="pip s1"></i>right once</span>
        <span><i class="pip s2"></i>right 2+ in a row</span>
      </div>
      <div id="list"></div>
      <button class="reset" id="reset">Reset my progress</button>
    </aside>
  </div>
</div>

<script>
const MAP = /*__MAP_DATA__*/null;

// ---------- content ----------
const ITEMS = [
  { id: 'hokkaido', name: 'Hokkaido', cat: 'islands', map: 'japan', hint: 'Northernmost of the four main islands, across the Tsugaru Strait from Honshu. Sapporo is its big city.' },
  { id: 'honshu', name: 'Honshu', cat: 'islands', map: 'japan', hint: 'The big central island. Nine of your ten cities are on it; only Nagasaki is not.' },
  { id: 'shikoku', name: 'Shikoku', cat: 'islands', map: 'japan', hint: 'Smallest of the four, tucked under Honshu across the Inland Sea. The name means “four provinces.”' },
  { id: 'kyushu', name: 'Kyushu', cat: 'islands', map: 'japan', hint: 'The southwestern main island, closest to Korea. Nagasaki is on its west coast. The name means “nine provinces.”' },

      zoomAt(v, Math.hypot(a[0] - b[0], a[1] - b[1]) / start.d, start.mid[0], start.mid[1]);
    }
  });
  const end = (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const tap = ptrs.size === 1 && !moved && !pinched && e.type === 'pointerup';
    ptrs.delete(e.pointerId);
    if (ptrs.size === 1) { const [p] = [...ptrs.values()]; start = { x: p[0], y: p[1], vb: { ...v.vb } }; moved = true; }
    else if (ptrs.size === 0) start = null;
    if (tap) onMapTap(v, e.clientX, e.clientY);
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    cancelAnimationFrame(v.anim);
    const [x, y] = toSvg(v, e.clientX, e.clientY);
    zoomAt(v, Math.exp(-e.deltaY * (e.deltaMode === 1 ? .05 : .0025)), x, y);
  }, { passive: false });
}

// ---------- hit testing ----------
function nearestDot(v, cx, cy, withContext) {
  if (v.key !== 'japan') return null;
  const [x, y] = toSvg(v, cx, cy);
  let best = null, bd = SNAP_PX * v.vb.w / (v.rw || measure(v));
  for (const c of v.m.cities) { const d = Math.hypot(c.p[0] - x, c.p[1] - y); if (d < bd) { bd = d; best = c.id; } }
  if (withContext) for (const c of v.m.context) {
    if (!c.dot) continue;
    const d = Math.hypot(c.p[0] - x, c.p[1] - y);
    if (d < bd) { bd = d; best = `ctx:${c.name}`; }
  }
  return best;
}
function regionAt(cx, cy) {
  const stack = document.elementsFromPoint ? document.elementsFromPoint(cx, cy) : [document.elementFromPoint(cx, cy)];
  for (const n of stack) {
    const id = n && n.getAttribute && n.getAttribute('data-id');
    if (id && !CITY_IDS.has(id)) return id;
  }
  return null;
}
const hitAt = (v, cx, cy, snapCities) => (snapCities && nearestDot(v, cx, cy, true)) || regionAt(cx, cy);

// ---------- state ----------
const state = {
  mode: 'study', view: 'japan',
  cat: store.get('jmq-cat', 'all'), style: store.get('jmq-style', 'pick'),
  showLabels: true, letters: false, revealed: new Set(), focus: null, trick: null,
  queue: [], item: null, locked: false, lockedAt: 0, round: null, custom: null, restore: null, timer: 0,
  mock: null, leaveArmed: false, leaveTimer: 0,
};
if (!CATS.some(([k]) => k === state.cat)) state.cat = 'all';
if (state.style !== 'pick' && state.style !== 'type') state.style = 'pick';

let views = {};

function setView(key) {
  state.view = key;
  const m = MAP[key];
  $('mapwrap').style.setProperty('--ar', (m.w / m.h).toFixed(4));
  for (const v of Object.values(views)) v.svg.toggleAttribute('hidden', v.key !== key);
  document.querySelectorAll('#viewseg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === key)));
  const v = views[key];

}
function lockView(locked) { document.querySelectorAll('#viewseg button').forEach((b) => { b.disabled = locked; }); }

// ---------- marks ----------
function nodesFor(id) {
  const out = [];
  for (const v of Object.values(views)) out.push(...v.svg.querySelectorAll(`[data-id="${id}"]:not(.halo)`));
  return out;
}
function mark(id, ...cls) { for (const n of nodesFor(id)) n.classList.add(...cls); }
function label(id, ...cls) {

  }
}
function cityText(id, str) { writeText(views.japan.lblEls[id], str); }
function addRing(v, x, y, rpx, rmin, cls) {
  const r = el('circle', { class: `ring ${cls || ''}`.trim(), cx: x, cy: y, r: 1 }, v.gRing);
  r._rpx = rpx; r._rmin = rmin;
  r.setAttribute('r', Math.max(rmin, rpx * v.vb.w / (v.rw || measure(v))).toFixed(2));
  return r;
}
// Rings and bands make tiny targets (cities, Okinawa, the Ryukyu chain) visible at any zoom.
function smallMark(id, cls = '', pulse = false) {

  if (CITY_IDS.has(id)) { const v = views.japan, p = v.cityPt[id]; n = addRing(v, p[0], p[1], 15, 0, cls); }
  else if (id === 'okinawa') { const v = views.region; n = addRing(v, v.m.okinawa[0], v.m.okinawa[1], 16, 16, cls); }
  else if (id === 'ryukyu') { n = views.region.band; n.setAttribute('class', `band on ${cls}`.trim()); }
  if (n && pulse) n.classList.add('answer');
}
function clearMarks() {
  for (const v of Object.values(views)) {
    v.svg.querySelectorAll('.hl, .good, .bad, .answer').forEach((n) => n.classList.remove('hl', 'good', 'bad', 'answer'));
    for (const t of Object.values(v.lblEls)) t.setAttribute('class', t._base);

// paint = draw the current mode's resting look. Answer feedback is layered on afterwards.
function paint() {
  clearMarks();
  if (state.mode === 'study') paintStudy();
  else if (state.mode === 'name' && state.item && !state.locked) { mark(state.item.id, 'hl'); smallMark(state.item.id); }
  else if (state.mode === 'mock' && state.mock) paintMock();
}
function paintStudy() {
  const t = state.trick;
  for (const it of ITEMS) {
    const show = state.showLabels || state.revealed.has(it.id) || (t && t.ids.includes(it.id));
    if (CITY_IDS.has(it.id) && state.letters) {
      cityText(it.id, `(${LETTER[it.id]})${show ? ` ${it.name}` : ''}`);
      label(it.id, show ? '' : 'ghost');

// ---------- modes ----------
function feedback(html, tone = '') {
  const f = $('feedback');

  f.innerHTML = html;
}
function requestMode(mode) {
  const mk = state.mock;

    if (!state.leaveArmed) {
      state.leaveArmed = true;
      clearTimeout(state.leaveTimer);
      state.leaveTimer = setTimeout(() => { state.leaveArmed = false; }, 5000);
      feedback(`<div class="msg"><b>Leave the mock quiz?</b> Your labels will be lost. Tap ${MODE_NAMES[mode]} again to leave.</div>`, 'no');
      return false;

}
function setMode(mode) {
  clearTimeout(state.timer);

  Object.assign(state, { mode, item: null, locked: false, mock: null, focus: null, trick: null, leaveArmed: false, restore: null });
  if (mode !== 'find') state.custom = null;
  document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === mode)));
  $('choices').hidden = true; $('typeit').hidden = true; $('bank').hidden = true;
  $('tricks').hidden = mode !== 'study';
  lockView(mode === 'find' || mode === 'name');
  for (const v of Object.values(views)) resetZoom(v, false);
  renderTricksActive();

}
function scrollToMap() {
  const r = $('mapwrap').getBoundingClientRect();

}

// Study
function startStudy() {
  state.revealed.clear();
  setView(state.view);
  renderStudyPrompt();
  feedback('<div class="msg">This is the answer key. Tap any place for a way to remember it, or hide the names and test yourself. Pinch or use + to zoom into the city clusters.</div>');
  paint();
}
function renderStudyPrompt() {
  $('prompt').innerHTML = `<div class="grow"><div class="eyebrow">Study · ${PAGE[state.view]}</div><div class="target">${state.showLabels ? 'The answer key' : 'Names hidden'}</div></div>
    <div class="btnrow"><button class="btn" id="toggle-l">${state.showLabels ? 'Hide names' : 'Show names'}</button>
    <button class="btn" id="toggle-a" aria-pressed="${state.letters}">Sheet letters</button></div>`;
  $('toggle-l').onclick = () => {
    state.showLabels = !state.showLabels; state.revealed.clear(); state.focus = null; state.trick = null;
    renderStudyPrompt(); renderTricksActive(); paint();

  };
  $('toggle-a').onclick = () => { state.letters = !state.letters; renderStudyPrompt(); paint(); };
}
function focusItem(id, { zoom = false, fromList = false } = {}) {
  const it = BY_ID[id];
  state.focus = id; state.trick = null; state.revealed.add(id);
  renderTricksActive();
  if (fromList && state.view !== it.map) { setView(it.map); renderStudyPrompt(); }
  paint();
  if (zoom && isSmall(id)) zoomToPts(views[state.view], pointsFor(views[state.view], [id]));
  const tag = CITY_IDS.has(id) ? `<span class="tag">(${LETTER[id]}) on the handout</span>` : '';
  feedback(`<div class="msg"><b>${it.name}</b>${tag}<span class="hint">${it.hint}</span></div>`);
}
function studyTap(v, cx, cy) {
  const id = hitAt(v, cx, cy, true);
  if (!id) return;
  if (BY_ID[id]) return focusItem(id);
  state.focus = null; state.trick = null; renderTricksActive(); paint();
  const ctx = id.startsWith('ctx:');
  feedback(`<div class="msg"><b>${cap(nameOf(id))}</b><span class="hint">${ctx ? 'Printed on the handout as a landmark. Not one of your 25.' : 'Not one of your 25.'}</span></div>`);
}
function renderTricks() {
  $('trick-grid').innerHTML = TRICKS.map((t) => `<article class="trick" data-card="${t.id}"><h3>${t.title}</h3><p>${t.text}</p><button class="linkbtn" data-trick="${t.id}">Show on map</button></article>`).join('');
}
function renderTricksActive() {
  document.querySelectorAll('.trick').forEach((c) => c.classList.toggle('active', !!state.trick && state.trick.id === c.dataset.card));
}
function showTrick(t) {

  state.trick = t; state.focus = null;
  if (t.letters) state.letters = true;
  setView(t.view); renderStudyPrompt(); renderTricksActive(); paint();
  const v = views[t.view];
  if (t.zoom) zoomToPts(v, pointsFor(v, t.ids)); else resetZoom(v);
  feedback(`<div class="msg"><b>${t.title}</b><span class="hint">${t.text}</span></div>`);
  scrollToMap();
}

// Find it / Name it
function pool() {
  if (state.custom) return state.custom;
  if (state.cat === 'weak') {
    const w = ITEMS.filter((i) => level(i.id) !== 's2').map((i) => i.id);
    return w.length ? w : ITEMS.map((i) => i.id);
  }
  return ITEMS.filter((i) => state.cat === 'all' || i.cat === state.cat).map((i) => i.id);
}
function scopeName() {
  if (state.custom) return 'Your misses';
  const c = CATS.find(([k]) => k === state.cat);
  return c ? c[1] : 'All 25';
}
function startRound() {
  const ids = shuffle(pool());
  state.queue = ids.map((id) => BY_ID[id]);
  state.round = { total: ids.length, done: new Set(), firstTry: 0, missed: new Set() };
  feedback(state.mode === 'find'
    ? '<div class="msg">A name appears above the map. Tap that place. Pinch or use + to zoom in for the cities. Misses come back a few turns later.</div>'
    : '<div class="msg">A place lights up. Pick its name, or switch to <b>Type</b> to practice spelling for the paper quiz.</div>');
  next();
}
function next() {
  clearTimeout(state.timer);
  restoreZoom();
  state.locked = false;
  const it = state.queue.shift();
  if (!it) return finishRound();
  state.item = it;
  if (state.view !== it.map) setView(it.map);
  paint();
  renderRoundPrompt();
  if (state.mode === 'name') renderAnswerUI(it);
}
function renderRoundPrompt() {
  const r = state.round, it = state.item;
  if (!r || !it) return;
  const n = Math.min(r.done.size + 1, r.total);
  const eyebrow = `${MODE_NAMES[state.mode]} · ${scopeName()} · ${n} of ${r.total}`;
  const score = `<div class="score">${r.firstTry} first try<br>${r.missed.size} missed</div>`;
  if (state.mode === 'find') {
    $('prompt').innerHTML = `<div class="grow"><div class="eyebrow">${eyebrow}</div><div class="target">${it.name}</div></div>${score}`;
    return;
  }
  $('prompt').innerHTML = `<div class="grow"><div class="eyebrow">${eyebrow}</div><div class="target">Which ${CAT_ONE[it.cat]}?</div></div>
    <div class="seg" id="styleseg" role="group" aria-label="Answer by"><button data-style="pick" aria-pressed="${state.style === 'pick'}">Pick</button><button data-style="type" aria-pressed="${state.style === 'type'}">Type</button></div>${score}`;
  $('styleseg').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b || b.dataset.style === state.style) return;
    state.style = b.dataset.style; store.set('jmq-style', state.style);
    renderRoundPrompt();
    if (!state.locked) renderAnswerUI(state.item);
    else { $('choices').hidden = state.style !== 'pick'; $('typeit').hidden = state.style === 'pick'; }
  };
}
function renderAnswerUI(it) {
  const pick = state.style === 'pick';
  $('choices').hidden = !pick; $('typeit').hidden = pick;
  if (pick) return renderChoices(it);
  const inp = $('type-in');
  inp.value = '';
  $('type-go').textContent = 'Check';
  if (!coarse) inp.focus({ preventScroll: true });
}
function renderChoices(it) {
  const opts = shuffle([it, ...shuffle(ITEMS.filter((i) => i.cat === it.cat && i.id !== it.id)).slice(0, 3)]);
  const c = $('choices');
  c.innerHTML = '';
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<kbd>${i + 1}</kbd>${o.name}`;
    b.dataset.id = o.id;
    b.onclick = () => {
      if (state.locked) return;
      c.querySelectorAll('button').forEach((x) => { x.disabled = true; if (x.dataset.id === it.id) x.classList.add('right'); });
      if (o.id !== it.id) b.classList.add('wrong');
      settle(o.id === it.id, { tapped: o.id, msg: o.id === it.id ? '' : `Not ${o.name}. This is ${it.name}.` });
    };
    c.appendChild(b);
  });
}
function judge(it, text) {
  const n = norm(text);
  if (accepts(it).includes(n)) return { ok: true };
  const other = ITEMS.find((o) => o !== it && accepts(o).includes(n));
  if (other) return { ok: false, other: other.id, msg: `${other.name} is somewhere else. This is ${it.name}.` };
  if (accepts(it).some((a) => lev(a, n) <= (a.length > 5 ? 2 : 1))) return { ok: false, msg: `Almost. Check the spelling: ${it.name}.` };
  return { ok: false, msg: `This is ${it.name}.` };
}
function settle(ok, { tapped = null, msg = '', pt = null } = {}) {
  const it = state.item, r = state.round;
  if (!it || !r || state.locked) return;
  const first = !r.missed.has(it.id);
  state.locked = true; state.lockedAt = Date.now();
  record(it.id, ok);
  paint();
  if (ok) {
    r.done.add(it.id);
    if (first) r.firstTry++;
    mark(it.id, 'good'); label(it.id, 'ok'); smallMark(it.id, 'good');
    feedback(`<div class="msg"><b>${msg || `Yes, ${it.name}.`}</b><span class="hint">${it.hint}</span></div>`, 'ok');
    state.timer = setTimeout(() => { if (state.item === it && state.locked) next(); }, 1200);
  } else {
    r.missed.add(it.id);
    state.queue.splice(Math.min(3, state.queue.length), 0, it);
    if (tapped && BY_ID[tapped] && tapped !== it.id) { mark(tapped, 'bad'); label(tapped, 'no'); if (CITY_IDS.has(tapped)) smallMark(tapped, 'bad'); }
    mark(it.id, 'good', 'answer'); label(it.id, 'ok', 'answer'); smallMark(it.id, 'good', true);
    feedback(`<div class="msg"><b>${msg}</b><span class="hint">${it.hint}</span></div><button class="btn primary" id="nx">Next</button>`, 'no');
    $('nx').onclick = next;
    if (isSmall(it.id)) autoZoom(it, pt);
  }
  renderRoundPrompt();
  if (state.mode === 'name' && state.style === 'type') { $('type-in').value = ''; $('type-go').textContent = 'Next'; }
}
// After a miss on a small target, zoom in so the answer is visible; the next question zooms back out.
function autoZoom(it, pt) {
  const v = views[it.map];
  const pts = pointsFor(v, [it.id]);
  if (!pts.length) return;
  if (pt && Math.hypot(pt[0] - pts[0][0], pt[1] - pts[0][1]) < v.m.w / 4) pts.push(pt);
  if (!state.restore) state.restore = { view: v.key, vb: { ...v.vb } };
  zoomToPts(v, pts);
}
function restoreZoom() {
  const s = state.restore;
  state.restore = null;
  if (s) animateVB(views[s.view], s.vb);
}
function findTap(v, cx, cy) {
  const it = state.item;
  if (!it) return;
  if (state.locked) { if ($('nx') && Date.now() - state.lockedAt > 600) next(); return; }
  const tapped = hitAt(v, cx, cy, CITY_IDS.has(it.id));
  if (!tapped) return;
  const ok = isRight(it.id, tapped);
  const what = tapped.startsWith('ctx:') ? `${tapped.slice(4)}, which isn’t on your list` : nameOf(tapped);
  settle(ok, { tapped, pt: toSvg(v, cx, cy), msg: ok ? '' : `That’s ${what}. ${it.name} is the one flashing.` });
}
function finishRound() {
  const r = state.round;
  state.item = null; state.locked = false;
  paint();
  $('choices').hidden = true; $('typeit').hidden = true;
  const misses = [...r.missed];
  $('prompt').innerHTML = `<div class="grow"><div class="eyebrow">${MODE_NAMES[state.mode]} · ${scopeName()} · done</div><div class="target">${r.firstTry} / ${r.total} first try</div></div>`;
  feedback(`<div class="results">
    <div>${misses.length ? `Took more than one try: ${misses.map(nameOf).join(', ')}.` : 'Every one on the first try.'}</div>
    <div class="row"><button class="btn primary" id="again">Go again</button>${misses.length ? '<button class="btn" id="redo">Drill just these</button>' : ''}</div></div>`);
  $('again').onclick = () => { state.custom = null; startRound(); renderSide(); };
  if (misses.length) $('redo').onclick = () => { state.custom = misses; startRound(); renderSide(); };
}

// Mock quiz: both handouts, the printed name lists, 10 minutes, change anything until you hand in.
function startMock() {
  state.mock = { placed: {}, selected: null, pendingDot: null, deadline: 0, left: EXAM_SECS, timer: 0, started: false, graded: false, armed: false, help: '', nudge: false };
  setView('japan');
  lockView(false);
  renderMockPrompt();
  paint();
  feedback(`<div class="msg"><b>Set up like the real handouts.</b> Map 1 has lettered dots for the ten cities plus the four main islands. Map 2 has the eleven places around Japan. The names are listed for you, as on the sheet. Pick a name, then tap its spot. You can move labels until you hand in.</div>
    <button class="btn primary" id="go">Start the 10-minute clock</button>`);
  $('go').onclick = () => {
    const mk = state.mock;
    if (!mk || mk.started) return;
    mk.started = true;
    mk.deadline = Date.now() + EXAM_SECS * 1000;
    mk.timer = setInterval(tickMock, 250);
    renderBank(); renderMockPrompt(); paint();
    feedback('<div class="msg">Do Map 1 first, then switch with the link above the names. Tap a placed label to pick it back up.</div>');
  };
}
function tickMock() {
  const mk = state.mock;
  if (!mk || !mk.started || mk.graded) return;
  const left = Math.max(0, Math.ceil((mk.deadline - Date.now()) / 1000));
  if (left !== mk.left) {
    mk.left = left;
    const t = $('timer');
    if (t) { t.textContent = clock(left); t.classList.toggle('low', left < 60); }
  }
  if (left <= 0) handIn(true);
}
function renderMockPrompt() {
  const mk = state.mock;
  if (!mk || mk.graded) return;
  const placed = Object.keys(mk.placed).length;
  $('prompt').innerHTML = `<div class="timer${mk.left < 60 ? ' low' : ''}" id="timer">${clock(mk.left)}</div>
    <div class="grow"><div class="eyebrow">Mock quiz · ${PAGE[state.view]}</div><div class="target">${mk.started ? `${placed} of 25 placed` : '25 places, 10 minutes'}</div></div>
    ${mk.started ? `<button class="btn ${mk.armed ? 'warn' : 'primary'}" id="handin">${mk.armed ? `Hand in with ${25 - placed} blank?` : 'Hand in'}</button>` : ''}`;
  const h = $('handin');
  if (h) h.onclick = () => {
    const blank = 25 - Object.keys(mk.placed).length;
    if (blank > 0 && !mk.armed) {
      mk.armed = true;
      renderMockPrompt();
      setTimeout(() => { if (state.mock === mk && mk.armed && !mk.graded) { mk.armed = false; renderMockPrompt(); } }, 4000);
      return;
    }
    handIn(false);
  };
}
function renderBank() {
  const mk = state.mock;
  if (!mk || !mk.started || mk.graded) { $('bank').hidden = true; return; }
  const page = state.view, other = page === 'japan' ? 'region' : 'japan';
  const ids = SHEET[page];
  const done = ids.filter((id) => mk.placed[id]).length;
  const otherLeft = SHEET[other].filter((id) => !mk.placed[id]).length;
  const sel = mk.selected && BY_ID[mk.selected];
  const help = mk.help || (sel ? `Now tap where <b>${sel.name}</b> goes${CITY_IDS.has(sel.id) ? ': one of the lettered dots' : ''}.`
    : mk.pendingDot ? `Dot (${LETTER[mk.pendingDot]}) is selected. Pick its name.`
    : 'Pick a name, then tap its spot. Tap a placed label to move it.');
  $('bank').hidden = false;
  $('bank').innerHTML = `<div class="bank-head"><span><b>${PAGE[page]}</b> · ${done} of ${ids.length} placed</span>
      <button class="linkbtn" id="flip">${PAGE[other]} · ${otherLeft ? `${otherLeft} left` : 'done'} →</button></div>
    <div class="bank-chips">${ids.map((id) => `<button data-id="${id}" class="${mk.placed[id] ? 'placed' : ''}" aria-pressed="${mk.selected === id}">${BY_ID[id].name}</button>`).join('')}</div>
    <div class="bank-help${mk.nudge ? ' nudge' : ''}">${help}</div>`;
  mk.help = ''; mk.nudge = false;
}
function bankHelp(msg, nudge) {
  const mk = state.mock;
  mk.help = msg; mk.nudge = nudge;
  renderBank();
}
const ownerOfDot = (dot) => Object.keys(state.mock.placed).find((k) => CITY_IDS.has(k) && state.mock.placed[k].spot === dot) ?? null;
function placeCity(id, dot) {
  const prev = ownerOfDot(dot);
  if (prev && prev !== id) delete state.mock.placed[prev];
  state.mock.placed[id] = { view: 'japan', spot: dot };
}
function placedLabelAt(v, cx, cy) {
  const [x, y] = toSvg(v, cx, cy), pad = 8 * v.vb.w / (v.rw || measure(v));
  for (const [id, t] of Object.entries(v.placedEls)) {
    const b = t.getBBox();
    if (x >= b.x - pad && x <= b.x + b.width + pad && y >= b.y - pad && y <= b.y + b.height + pad) return id;
  }
  return null;
}
function mockTap(v, cx, cy) {
  const mk = state.mock;
  if (!mk || !mk.started || mk.graded) return;
  const sel = mk.selected ? BY_ID[mk.selected] : null;
  const dot = nearestDot(v, cx, cy, false);
  if (sel) {
    if (CITY_IDS.has(sel.id)) {
      if (!dot) return bankHelp('Cities go on a dot. Tap the lettered dot where it belongs.', true);
      placeCity(sel.id, dot);
    } else {
      const [x, y] = toSvg(v, cx, cy);
      mk.placed[sel.id] = { view: v.key, spot: regionAt(cx, cy) ?? 'pacific', x, y };
    }
    mk.selected = null; mk.pendingDot = null;
  } else {
    const owner = dot ? ownerOfDot(dot) : null;
    const lab = owner ? null : placedLabelAt(v, cx, cy);
    if (owner) { delete mk.placed[owner]; mk.selected = owner; mk.pendingDot = null; }
    else if (lab) { delete mk.placed[lab]; mk.selected = lab; }
    else if (dot) mk.pendingDot = mk.pendingDot === dot ? null : dot;
    else return bankHelp('Pick a name from the list first.', true);
  }
  renderBank(); renderMockPrompt(); paint();
}
function paintMock() {
  const mk = state.mock;
  for (const id of CITY_IDS) {
    const L = `(${LETTER[id]})`, owner = ownerOfDot(id);
    if (!mk.graded) {
      cityText(id, owner ? `${L} ${BY_ID[owner].name}` : L);
      label(id, owner ? 'mine' : 'ghost');
    } else {
      const ok = owner === id;
      cityText(id, `${L} ${BY_ID[id].name}`);
      label(id, ok ? 'ok' : 'no');
      if (!ok) smallMark(id, 'bad');
    }
  }
  if (mk.pendingDot) smallMark(mk.pendingDot, 'pending');
  for (const [id, p] of Object.entries(mk.placed)) {
    if (CITY_IDS.has(id)) continue;
    const v = views[p.view];
    let cls = 'lbl on placed', txt = MAPTEXT[id] ?? BY_ID[id].name;
    if (mk.graded) {
      const ok = isRight(id, p.spot);
      cls += ok ? ' ok' : ' struck';
      if (!ok) txt = `✗ ${txt}`;
    } else cls += ' mine';
    v.placedEls[id] = addText(v.gPlaced, txt, p.x, p.y, { cls });
  }
  if (mk.graded) for (const id of [...SHEET.japan, ...SHEET.region]) {
    if (CITY_IDS.has(id)) continue;
    const p = mk.placed[id];
    if (!p || !isRight(id, p.spot)) { label(id, 'no'); smallMark(id, 'bad'); }
  }
}
function handIn(timeUp) {
  const mk = state.mock;
  if (!mk || mk.graded) return;
  clearInterval(mk.timer);
  Object.assign(mk, { timer: 0, graded: true, selected: null, pendingDot: null, armed: false });
  const used = clamp(Math.round(EXAM_SECS - (mk.deadline - Date.now()) / 1000), 0, EXAM_SECS);
  const rows = [...SHEET.japan, ...SHEET.region].map((id) => { const p = mk.placed[id]; return { it: BY_ID[id], p, ok: !!p && isRight(id, p.spot) }; });
  rows.forEach((r) => record(r.it.id, r.ok, false));
  const score = rows.filter((r) => r.ok).length;
  const best = store.get('jmq-best', null);
  const isBest = !best || score > best.score || (score === best.score && used < best.secs);
  if (isBest) store.set('jmq-best', { score, secs: used });
  $('bank').hidden = true;
  lockView(false);
  paint();
  renderSide();
  $('prompt').innerHTML = `<div class="grow"><div class="eyebrow">Mock quiz · ${timeUp ? 'time’s up' : `handed in at ${fmt(used)}`}</div><div class="target">${score} / 25${isBest ? ' · new best' : ''}</div></div>`;
  const why = (r) => {
    if (!r.p) return 'left blank';
    if (CITY_IDS.has(r.it.id)) return `you wrote it at (${LETTER[r.p.spot]}), which is ${nameOf(r.p.spot)}`;
    return r.p.spot === 'pacific' ? 'you put it in open water' : `you put it on ${theName(r.p.spot)}`;
  };
  const list = (page) => rows.filter((r) => SHEET[page].includes(r.it.id)).map((r) =>
    `<li><span class="${r.ok ? 'v' : 'x'}">${r.ok ? '✓' : '✗'}</span><span>${r.it.name}${r.ok ? '' : ` <span class="why">· ${why(r)}</span>`}</span></li>`).join('');
  const misses = rows.filter((r) => !r.ok).map((r) => r.it.id);
  feedback(`<div class="results">
    <div>${score === 25 ? 'Perfect sheet. You’re ready.' : 'Green is right. Red marks the right answer for anything you missed; grey ✗ labels show where yours landed. Switch maps above to see both sheets.'}</div>
    <div class="cols"><div><h4>${PAGE.japan}</h4><ul>${list('japan')}</ul></div><div><h4>${PAGE.region}</h4><ul>${list('region')}</ul></div></div>
    <div class="row"><button class="btn primary" id="retake">Retake</button>${misses.length ? '<button class="btn" id="drill">Drill the ones I missed</button>' : ''}</div></div>`);
  $('retake').onclick = () => setMode('mock');
  if (misses.length) $('drill').onclick = () => { state.custom = misses; setMode('find'); };
}

// ---------- map taps ----------
function onMapTap(v, cx, cy) {
  if (v.key !== state.view) return;
  if (state.mode === 'study') studyTap(v, cx, cy);
  else if (state.mode === 'find') findTap(v, cx, cy);
  else if (state.mode === 'mock') mockTap(v, cx, cy);
}

// ---------- side panel ----------
function renderSide() {
  const lv = Object.fromEntries(ITEMS.map((i) => [i.id, level(i.id)]));
  const counts = { s2: 0, s1: 0, miss: 0, '': 0 };
  for (const i of ITEMS) counts[lv[i.id]]++;
  const weak = ITEMS.length - counts.s2;
  $('meter').innerHTML = `<h2>Your progress</h2>
    <div class="bar" role="img" aria-label="${counts.s2} solid, ${counts.s1} right once, ${counts.miss} missed, ${counts['']} new">
      <i style="width:${counts.s2 * 4}%;background:var(--ok)"></i><i style="width:${counts.s1 * 4}%;background:var(--warn)"></i><i style="width:${counts.miss * 4}%;background:var(--seal)"></i></div>
    <div class="txt">${counts.s2} of 25 solid · ${counts.s1} right once · ${counts.miss} missed · ${counts['']} new</div>`;
  const best = store.get('jmq-best', null);
  let step;
  if (!Object.keys(stats).length) step = { text: 'Start with the answer key and memory tricks, then try Find it.', btn: 'Start Find it', mode: 'find', cat: 'all' };
  else if (weak > 0) step = { text: `${weak} place${weak === 1 ? ' isn’t' : 's aren’t'} solid yet.`, btn: 'Drill weak spots', mode: 'find', cat: 'weak' };
  else if (!best || best.score < 24) step = { text: 'All 25 are solid. Time for a mock quiz.', btn: 'Take the mock quiz', mode: 'mock' };
  else step = { text: `Ready: ${best.score}/25 on the mock. Do one more right before class.`, btn: 'Mock quiz again', mode: 'mock' };
  $('nextstep').innerHTML = `<p>${step.text}</p><button class="btn primary" id="nextgo">${step.btn}</button>`;
  $('nextgo').onclick = () => {
    if (step.cat) { state.cat = step.cat; store.set('jmq-cat', step.cat); }
    state.custom = null;
    if (requestMode(step.mode)) scrollToMap();
  };
  $('best').innerHTML = best ? `Best mock quiz: <b>${best.score} / 25</b> in ${fmt(best.secs)}` : 'No mock quiz yet.';
  $('setbox').hidden = !(state.mode === 'find' || state.mode === 'name');
  $('chips').innerHTML = CATS.map(([k, n]) => {
    const text = k === 'weak' ? `${n} · ${weak}` : n;
    return `<button data-cat="${k}" aria-pressed="${!state.custom && state.cat === k}" ${k === 'weak' && weak === 0 ? 'disabled' : ''}>${text}</button>`;
  }).join('');
  $('list').innerHTML = ['islands', 'seas', 'countries', 'cities'].map((k) => {
    const its = ITEMS.filter((i) => i.cat === k);
    return `<div class="cat"><h3>${CAT_NAMES[k]} <span>${its.length}</span></h3>${its.map((i) => {
      const s = stats[i.id];
      return `<button class="item" data-id="${i.id}"><i class="pip ${lv[i.id]}"></i><span class="n">${i.name}</span><span class="r">${s ? `${s.r}✓ ${s.w}✗` : ''}</span></button>`;
    }).join('')}</div>`;
  }).join('');
}

// ---------- wiring ----------
function init() {
  views = { japan: buildView('japan'), region: buildView('region') };
  for (const v of Object.values(views)) attachGestures(v);
  renderTricks();

  document.querySelector('.modes').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b && b.dataset.mode !== state.mode) requestMode(b.dataset.mode);
  });
  $('viewseg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || b.disabled || b.dataset.view === state.view) return;
    setView(b.dataset.view);
    if (state.mode === 'study') renderStudyPrompt();
    if (state.mode === 'mock' && state.mock) {
      state.mock.selected = null; state.mock.pendingDot = null;
      renderBank(); renderMockPrompt();
    }
    paint();
  });
  $('z-in').onclick = () => { const v = views[state.view]; zoomAt(v, 1.6, v.vb.x + v.vb.w / 2, v.vb.y + v.vb.h / 2); };
  $('z-out').onclick = () => { const v = views[state.view]; zoomAt(v, 1 / 1.6, v.vb.x + v.vb.w / 2, v.vb.y + v.vb.h / 2); };
  $('z-reset').onclick = () => resetZoom(views[state.view]);
  $('trick-grid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-trick]');
    if (b) showTrick(TRICKS.find((t) => t.id === b.dataset.trick));
  });
  $('typeit').addEventListener('submit', (e) => {
    e.preventDefault();
    if (state.mode !== 'name' || !state.item) return;
    if (state.locked) { next(); return; }
    const text = $('type-in').value;
    if (!norm(text)) return;
    const res = judge(state.item, text);
    settle(res.ok, { tapped: res.other ?? null, msg: res.msg ?? '' });
  });
  $('bank').addEventListener('click', (e) => {
    const mk = state.mock;
    if (!mk || !mk.started || mk.graded) return;
    if (e.target.closest('#flip')) {
      setView(state.view === 'japan' ? 'region' : 'japan');
      mk.selected = null; mk.pendingDot = null;
      renderBank(); renderMockPrompt(); paint();
      return;
    }
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    const id = b.dataset.id;
    if (mk.selected === id) mk.selected = null;
    else {
      delete mk.placed[id];
      mk.selected = id;
      if (mk.pendingDot && CITY_IDS.has(id)) { placeCity(id, mk.pendingDot); mk.selected = null; }
    }
    mk.pendingDot = null;
    renderBank(); renderMockPrompt(); paint();
  });
  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    state.cat = b.dataset.cat; state.custom = null; store.set('jmq-cat', state.cat);
    renderSide(); startRound();
  });
  $('list').addEventListener('click', (e) => {
    const b = e.target.closest('.item');
    if (!b) return;
    if (state.mode !== 'study' && !requestMode('study')) return;
    focusItem(b.dataset.id, { zoom: true, fromList: true });
    scrollToMap();
  });
  let resetArmed = false;
  $('reset').onclick = () => {
    if (!resetArmed) {
      resetArmed = true; $('reset').textContent = 'Tap again to erase your progress';
      setTimeout(() => { resetArmed = false; $('reset').textContent = 'Reset my progress'; }, 3000);
      return;
    }
    stats = {}; store.set('jmq-stats', stats); store.set('jmq-best', null);
    resetArmed = false; $('reset').textContent = 'Reset my progress';
    renderSide();
  };
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (state.mode === 'name' && state.style === 'pick' && !state.locked && /^[1-4]$/.test(e.key)) $('choices').children[+e.key - 1]?.click();
    else if (e.key === 'Enter' && state.locked && $('nx') && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); $('nx').click(); }
  });
  if (window.ResizeObserver) new ResizeObserver(() => { const v = views[state.view]; measure(v); applyVB(v); }).observe($('mapwrap'));

  setView('japan');
  setMode('study');
}
init();
</script>
