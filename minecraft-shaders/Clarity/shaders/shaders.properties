# Clarity shaders - pipeline and menu configuration.

# Vanilla pieces that the pack replaces or that fight clarity.
oldLighting=false
oldHandLight=false
dynamicHandLight=true
underwaterOverlay=false
vignette=false
# Sun disc, stars and clouds are procedural; the moon keeps its phases.
sun=false
moon=true
clouds=off

# Pipeline.
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
frustum.culling=true
shadow.culling=true
separateAo=false
rain.depth=false
beacon.beam.depth=true

# ------------------------------------------------------------- menu
screen=<profile> <empty> [LIGHTING] [SHADOWS] [WATER] [SKY] [WORLD] [CAMERA]
screen.LIGHTING=SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS NIGHT_BRIGHTNESS MIN_LIGHT EMISSIVE_STRENGTH SSAO SSAO_STRENGTH ambientOcclusionLevel FOLIAGE_SSS WET_SURFACES <empty> BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B
screen.SHADOWS=SHADOWS PCSS COLORED_SHADOWS <empty> shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES sunPathRotation
screen.WATER=WATER_WAVES WATER_REFRACTION SSR CAUSTICS WATER_CLARITY WATER_TEXTURE UNDERWATER_VIEW
screen.SKY=CLOUDS CLOUD_SHADOWS CLOUD_COVERAGE CLOUD_OPACITY CLOUD_HEIGHT <empty> VOLUMETRIC_LIGHT VL_STRENGTH VL_STEPS <empty> HAZE FOG_START STAR_BRIGHTNESS SUN_SIZE RAIN_OPACITY
screen.WORLD=WAVING_PLANTS WAVING_LEAVES WAVING_SPEED WAVING_AMOUNT
screen.CAMERA=AUTO_EXPOSURE EXPOSURE CAVE_ADAPTATION <empty> SATURATION CONTRAST BLOOM BLOOM_STRENGTH FXAA SHARPEN

sliders=shadowMapResolution shadowDistance sunPathRotation ambientOcclusionLevel SHADOW_SOFTNESS SHADOW_SAMPLES \
 SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B MIN_LIGHT NIGHT_BRIGHTNESS \
 EMISSIVE_STRENGTH SSAO_STRENGTH WAVING_SPEED WAVING_AMOUNT WATER_CLARITY WATER_TEXTURE UNDERWATER_VIEW \
 CLOUD_COVERAGE CLOUD_OPACITY CLOUD_HEIGHT VL_STRENGTH VL_STEPS HAZE FOG_START STAR_BRIGHTNESS SUN_SIZE RAIN_OPACITY \
 EXPOSURE CAVE_ADAPTATION SATURATION CONTRAST BLOOM_STRENGTH SHARPEN

# ------------------------------------------------------------- profiles
# RTX5080 is the default: everything on, 120 fps locked with headroom.
# COMPETITIVE keeps the lighting but removes anything that moves, glows
# or hazes the view.
profile.COMPETITIVE=shadowMapResolution=1536 shadowDistance=80.0 SHADOW_SAMPLES=8 !PCSS !COLORED_SHADOWS !WAVING_PLANTS !WAVING_LEAVES !VOLUMETRIC_LIGHT !CLOUD_SHADOWS !BLOOM !WET_SURFACES HAZE=0.0 RAIN_OPACITY=0.20 FOG_START=0.80 MIN_LIGHT=0.060 CAVE_ADAPTATION=2.20 VL_STEPS=8
profile.BALANCED=shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SAMPLES=8 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES VL_STEPS=8
profile.RTX5080=shadowMapResolution=2048 shadowDistance=112.0 SHADOW_SAMPLES=12 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES VL_STEPS=12
profile.CINEMATIC=shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=24 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES VL_STEPS=24
