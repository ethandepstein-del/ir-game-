# Clarity shaders - pipeline and menu configuration.

# Vanilla pieces that the pack replaces or that fight clarity.
oldLighting=false
oldHandLight=false
dynamicHandLight=true
underwaterOverlay=false
vignette=false
# Sun disc, stars and clouds are procedural; the moon keeps its phases.
sun=false
moon=true
clouds=off

# Pipeline.
shadowTerrain=true
shadowTranslucent=true
#ifdef ENTITY_SHADOWS
shadowEntities=true
#else
shadowEntities=false
#endif
# Chests, signs, banners etc. cost a second CPU draw for little visual gain.
shadowBlockEntities=false
frustum.culling=true
#ifdef RT_GI
# The voxel grid needs every chunk around the player, not only the ones
# that can cast a shadow into view.
shadow.culling=false
#else
shadow.culling=true
#endif
# Particles draw after the deferred passes, so they never feed GI/SSAO
# with the surface data of the block behind them.
particles.ordering=after
# No sun in the Nether or End: skip the shadow pass entirely there.
program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false
separateAo=false
rain.depth=false
beacon.beam.depth=true

# ------------------------------------------------------------- menu
screen=<profile> <empty> [LIGHTING] [RAYTRACING] [SHADOWS] [WATER] [SKY] [WORLD] [CAMERA]
screen.LIGHTING=SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS NIGHT_BRIGHTNESS MIN_LIGHT EMISSIVE_STRENGTH SSAO SSAO_STRENGTH ambientOcclusionLevel FOLIAGE_SSS WET_SURFACES <empty> BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B
screen.SHADOWS=SHADOWS PCSS COLORED_SHADOWS ENTITY_SHADOWS shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES sunPathRotation
screen.RAYTRACING=RT_GI RT_REFLECTIONS RT_RAYS RT_DISTANCE RT_HISTORY RT_GI_STRENGTH
screen.WATER=WATER_WAVES WAVE_HEIGHT WAVE_SPEED RAIN_RIPPLES WATER_REFRACTION SSR CAUSTICS WATER_FOAM WATER_SSS WATER_CLARITY WATER_TEXTURE UNDERWATER_VIEW
screen.SKY=CLOUDS CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH CLOUD_COVERAGE CLOUD_OPACITY CLOUD_HEIGHT <empty> VOLUMETRIC_LIGHT VL_STRENGTH VL_STEPS <empty> HAZE FOG_START STAR_BRIGHTNESS SUN_SIZE RAIN_OPACITY
screen.WORLD=WAVING_PLANTS WAVING_LEAVES WAVING_SPEED WAVING_AMOUNT
screen.CAMERA=AUTO_EXPOSURE NIGHT_SHIFT EXPOSURE CAVE_ADAPTATION SATURATION CONTRAST BLOOM BLOOM_STRENGTH FXAA SHARPEN

sliders=CLOUD_SHADOW_STRENGTH shadowMapResolution shadowDistance sunPathRotation ambientOcclusionLevel SHADOW_SOFTNESS SHADOW_SAMPLES \
 SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B MIN_LIGHT NIGHT_BRIGHTNESS \
 EMISSIVE_STRENGTH SSAO_STRENGTH WAVING_SPEED WAVING_AMOUNT WATER_CLARITY WATER_TEXTURE UNDERWATER_VIEW \
 CLOUD_COVERAGE CLOUD_OPACITY CLOUD_HEIGHT VL_STRENGTH VL_STEPS HAZE FOG_START STAR_BRIGHTNESS SUN_SIZE RAIN_OPACITY \
 EXPOSURE CAVE_ADAPTATION SATURATION CONTRAST BLOOM_STRENGTH SHARPEN \
 RT_RAYS RT_DISTANCE RT_HISTORY RT_GI_STRENGTH WAVE_HEIGHT WAVE_SPEED

# ------------------------------------------------------------- profiles
# RTX5080 is the default: everything on, 120 fps locked with headroom.
# COMPETITIVE keeps the lighting but removes anything that moves, glows
# or hazes the view.
profile.COMPETITIVE=shadowMapResolution=1536 shadowDistance=80.0 SHADOW_SAMPLES=8 !PCSS !COLORED_SHADOWS !WAVING_PLANTS !WAVING_LEAVES !VOLUMETRIC_LIGHT !CLOUD_SHADOWS !BLOOM !WET_SURFACES VL_STEPS=8 !RT_GI HAZE=0.0 RAIN_OPACITY=0.20 FOG_START=0.80 MIN_LIGHT=0.060 CAVE_ADAPTATION=2.20 STAR_BRIGHTNESS=0.50 !AUTO_EXPOSURE !NIGHT_SHIFT !CAUSTICS !ENTITY_SHADOWS
profile.BALANCED=shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SAMPLES=8 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES VL_STEPS=8 !RT_GI HAZE=1.00 RAIN_OPACITY=0.55 FOG_START=0.70 MIN_LIGHT=0.030 CAVE_ADAPTATION=1.80 STAR_BRIGHTNESS=1.00 AUTO_EXPOSURE NIGHT_SHIFT CAUSTICS ENTITY_SHADOWS
profile.RTX5080=shadowMapResolution=2048 shadowDistance=112.0 SHADOW_SAMPLES=12 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES VL_STEPS=12 !RT_GI HAZE=1.00 RAIN_OPACITY=0.55 FOG_START=0.70 MIN_LIGHT=0.030 CAVE_ADAPTATION=1.80 STAR_BRIGHTNESS=1.00 AUTO_EXPOSURE NIGHT_SHIFT CAUSTICS ENTITY_SHADOWS
# RT: ray-traced sky light, bounce light and water reflections (Iris 1.18+).
profile.RT=shadowMapResolution=2048 shadowDistance=112.0 SHADOW_SAMPLES=12 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES VL_STEPS=12 RT_GI RT_REFLECTIONS RT_RAYS=1 RT_HISTORY=10 HAZE=1.00 RAIN_OPACITY=0.55 FOG_START=0.70 MIN_LIGHT=0.030 CAVE_ADAPTATION=1.80 STAR_BRIGHTNESS=1.00 AUTO_EXPOSURE NIGHT_SHIFT CAUSTICS ENTITY_SHADOWS
profile.CINEMATIC=shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=24 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES VL_STEPS=24 !RT_GI HAZE=1.00 RAIN_OPACITY=0.55 FOG_START=0.70 MIN_LIGHT=0.030 CAVE_ADAPTATION=1.80 STAR_BRIGHTNESS=1.00 AUTO_EXPOSURE NIGHT_SHIFT CAUSTICS ENTITY_SHADOWS

# ------------------------------------------------------------- ray tracing
# Iris only (Minecraft 1.18+). The shadow pass writes a 128^3 voxel copy of
# the world around the player; deferred passes trace rays through it.
image.voxelImg=voxelSampler RED_INTEGER R32UI UNSIGNED_INT true false 128 128 128
program.deferred.enabled=RT_GI
program.deferred1.enabled=RT_GI
program.deferred2.enabled=RT_GI
program.deferred3.enabled=RT_GI
program.deferred4.enabled=RT_GI
program.world-1/deferred.enabled=false
program.world-1/deferred1.enabled=false
program.world-1/deferred2.enabled=false
program.world-1/deferred3.enabled=false
program.world-1/deferred4.enabled=false
program.world1/deferred.enabled=false
program.world1/deferred1.enabled=false
program.world1/deferred2.enabled=false
program.world1/deferred3.enabled=false
program.world1/deferred4.enabled=false

# ------------------------------------------------------------- noise texture
# Tileable 128x128 blue noise, four independent channels (shadow rotation,
# volumetric and reflection jitter, dither). Made by tools/gen_bluenoise.cjs,
# read through lib/noise.glsl (NOISE_PATTERN=0 goes back to IGN).
texture.noise=textures/bluenoise.png
