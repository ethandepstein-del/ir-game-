# Clarity shaders - pipeline and menu configuration.

# Visual clarity: no vanilla overlays that fight the shaders.
oldLighting=false
oldHandLight=false
dynamicHandLight=true
underwaterOverlay=false
vignette=false
sun=true
moon=true
clouds=fancy

# Pipeline.
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
frustum.culling=true
shadow.culling=true
separateAo=false
rain.depth=false
beacon.beam.depth=true

# Blending for translucent passes (vanilla defaults, stated explicitly).
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# ------------------------------------------------------------- menu
screen=<profile> <empty> [LIGHTING] [SHADOWS] [WORLD] [WATER] [ATMOSPHERE] [CAMERA]
screen.LIGHTING=SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS NIGHT_BRIGHTNESS MIN_LIGHT EMISSIVE_STRENGTH <empty> <empty> BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B FOLIAGE_SSS ambientOcclusionLevel
screen.SHADOWS=SHADOWS COLORED_SHADOWS shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES sunPathRotation
screen.WORLD=WAVING_PLANTS WAVING_LEAVES WAVING_SPEED WAVING_AMOUNT
screen.WATER=WATER_WAVES WATER_REFLECTIONS WATER_OPACITY WATER_TEXTURE UNDERWATER_VIEW
screen.ATMOSPHERE=FOG_START RAIN_OPACITY CLOUD_OPACITY STAR_BRIGHTNESS GODRAYS GODRAY_STRENGTH
screen.CAMERA=EXPOSURE CAVE_ADAPTATION SATURATION CONTRAST BLOOM BLOOM_STRENGTH FXAA SHARPEN

sliders=shadowMapResolution shadowDistance sunPathRotation ambientOcclusionLevel SHADOW_SOFTNESS SHADOW_SAMPLES \
 SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B MIN_LIGHT NIGHT_BRIGHTNESS \
 EMISSIVE_STRENGTH WAVING_SPEED WAVING_AMOUNT WATER_OPACITY WATER_TEXTURE FOG_START UNDERWATER_VIEW RAIN_OPACITY \
 CLOUD_OPACITY STAR_BRIGHTNESS GODRAY_STRENGTH EXPOSURE CAVE_ADAPTATION SATURATION CONTRAST BLOOM_STRENGTH SHARPEN

# ------------------------------------------------------------- profiles
# RTX5080 is the default and what the pack is tuned for (120 fps locked
# with headroom). COMPETITIVE strips everything that moves or glows.
profile.COMPETITIVE=shadowMapResolution=1536 shadowDistance=80.0 SHADOW_SAMPLES=4 !COLORED_SHADOWS !WAVING_PLANTS !WAVING_LEAVES !GODRAYS !BLOOM RAIN_OPACITY=0.20 CLOUD_OPACITY=0.40 FOG_START=0.80 MIN_LIGHT=0.060 CAVE_ADAPTATION=2.20
profile.BALANCED=shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SAMPLES=8 COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES GODRAYS BLOOM
profile.RTX5080=shadowMapResolution=2048 shadowDistance=112.0 SHADOW_SAMPLES=8 COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES GODRAYS BLOOM
profile.CINEMATIC=shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=16 COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES GODRAYS BLOOM
