# ------------------------------------------------------------- profiles
# Profiles are tuned for an RTX 5080 + Ryzen 7 9800X3D (the X3D chip makes
# long shadow distances cheap on the CPU side; the GPU budget per pixel is
# what separates the profiles).
#   4K 60     everything at maximum, including 2-ray ray-traced lighting
#   4K 120    the full look with lighter per-pixel sampling (default)
#   1440p 120 higher sampling and longer, crisper shadows (2.25x fewer pixels)
#   Competitive keeps the lighting but drops anything that moves, glows or hazes.
profile.P4K_60=shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=24 VL_STEPS=24 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES SSR WATER_REFRACTION WATER_FOAM WATER_SSS RAIN_RIPPLES SSAO HAZE=1.00 RAIN_OPACITY=0.55 FOG_START=0.70 MIN_LIGHT=0.030 CAVE_ADAPTATION=1.80 STAR_BRIGHTNESS=1.00 AUTO_EXPOSURE NIGHT_SHIFT CAUSTICS ENTITY_SHADOWS VOLUMETRIC_CLOUDS CLOUD_TEMPORAL CLOUD_RES=2 CLOUD_STEPS=32 CLOUD_LIGHT_STEPS=5 CLOUD_DISTANCE=7000.0 RT_GI RT_REFLECTIONS RT_RESOLUTION=1.0 RT_RAYS=2 RT_DISTANCE=48.0 RT_HISTORY=10 NOISE_PATTERN=1 VL_BLUR_RADIUS=3 BLOOM_THRESHOLD=1.00
profile.P4K_120=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=8 VL_STEPS=10 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES SSR WATER_REFRACTION WATER_FOAM WATER_SSS RAIN_RIPPLES SSAO HAZE=1.00 RAIN_OPACITY=0.55 FOG_START=0.70 MIN_LIGHT=0.030 CAVE_ADAPTATION=1.80 STAR_BRIGHTNESS=1.00 AUTO_EXPOSURE NIGHT_SHIFT CAUSTICS ENTITY_SHADOWS VOLUMETRIC_CLOUDS CLOUD_TEMPORAL CLOUD_RES=4 CLOUD_STEPS=20 CLOUD_LIGHT_STEPS=3 CLOUD_DISTANCE=5000.0 !RT_GI RT_RESOLUTION=0.5 RT_RAYS=1 RT_HISTORY=16 NOISE_PATTERN=1 VL_BLUR_RADIUS=2 BLOOM_THRESHOLD=1.00
profile.P1440_120=shadowMapResolution=3072 shadowDistance=160.0 SHADOW_SAMPLES=16 VL_STEPS=16 PCSS COLORED_SHADOWS WAVING_PLANTS WAVING_LEAVES VOLUMETRIC_LIGHT CLOUD_SHADOWS BLOOM WET_SURFACES SSR WATER_REFRACTION WATER_FOAM WATER_SSS RAIN_RIPPLES SSAO HAZE=1.00 RAIN_OPACITY=0.55 FOG_START=0.70 MIN_LIGHT=0.030 CAVE_ADAPTATION=1.80 STAR_BRIGHTNESS=1.00 AUTO_EXPOSURE NIGHT_SHIFT CAUSTICS ENTITY_SHADOWS VOLUMETRIC_CLOUDS CLOUD_TEMPORAL CLOUD_RES=2 CLOUD_STEPS=24 CLOUD_LIGHT_STEPS=4 CLOUD_DISTANCE=7000.0 RT_GI RT_REFLECTIONS RT_RESOLUTION=0.7 RT_RAYS=1 RT_DISTANCE=32.0 RT_HISTORY=12 NOISE_PATTERN=1 VL_BLUR_RADIUS=3 BLOOM_THRESHOLD=1.00
profile.COMPETITIVE=shadowMapResolution=1536 shadowDistance=80.0 SHADOW_SAMPLES=8 !PCSS !COLORED_SHADOWS !WAVING_PLANTS !WAVING_LEAVES !VOLUMETRIC_LIGHT !CLOUD_SHADOWS !BLOOM !WET_SURFACES VL_STEPS=8 HAZE=0.0 RAIN_OPACITY=0.20 FOG_START=0.80 MIN_LIGHT=0.060 CAVE_ADAPTATION=2.20 STAR_BRIGHTNESS=0.50 !AUTO_EXPOSURE !NIGHT_SHIFT !CAUSTICS !ENTITY_SHADOWS VOLUMETRIC_CLOUDS CLOUD_TEMPORAL CLOUD_RES=4 CLOUD_STEPS=16 CLOUD_LIGHT_STEPS=3 CLOUD_DISTANCE=5000.0 !RT_GI NOISE_PATTERN=1 VL_BLUR_RADIUS=2 BLOOM_THRESHOLD=1.00

# ------------------------------------------------------------- ray tracing
# Iris only (Minecraft 1.18+). The shadow pass writes a 128^3 voxel copy of
# the world around the player; deferred passes trace rays through it:
#   deferred   trace (deferred.csh first: barrier for the voxel writes)
#   deferred1  upsample + temporal accumulation (slow/fast history, moments)
#   deferred2  a-trous 1: variance, history clamp, history feedback
#   deferred3  a-trous 2, deferred4 a-trous 4
#   deferred5  add indirect light to the scene
image.voxelImg=voxelSampler RED_INTEGER R32UI UNSIGNED_INT true false 128 128 128
program.deferred.enabled=RT_GI
program.deferred1.enabled=RT_GI
program.deferred2.enabled=RT_GI
program.deferred3.enabled=RT_GI
program.deferred4.enabled=RT_GI
program.deferred5.enabled=RT_GI
program.world-1/deferred.enabled=false
program.world-1/deferred1.enabled=false
program.world-1/deferred2.enabled=false
program.world-1/deferred3.enabled=false
program.world-1/deferred4.enabled=false
program.world-1/deferred5.enabled=false
program.world1/deferred.enabled=false
program.world1/deferred1.enabled=false
program.world1/deferred2.enabled=false
program.world1/deferred3.enabled=false
program.world1/deferred4.enabled=false
program.world1/deferred5.enabled=false

# ------------------------------------------------------------- volumetric clouds
# Iris only. The prepare pass (program/prepare_clouds.glsl) raymarches the
# clouds once per frame, before terrain, at 1/CLOUD_RES resolution into a
# corner of colortex11; gbuffers_skybasic upsamples it. OptiFine ignores
# this and keeps the flat cloud layer.
#if defined CLOUDS && defined VOLUMETRIC_CLOUDS
program.prepare.enabled=VOLUMETRIC_CLOUDS
#else
program.prepare.enabled=false
#endif
program.world-1/prepare.enabled=false
program.world1/prepare.enabled=false
screen.CLOUDS=VOLUMETRIC_CLOUDS CLOUD_RES CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_TEMPORAL CLOUD_DISTANCE CLOUD_THICKNESS CLOUD_DENSITY CLOUD_SPEED

# ------------------------------------------------------------- noise texture
# Tileable 128x128 blue noise, four independent channels (shadow rotation,
# volumetric and reflection jitter, dither). Made by tools/gen_bluenoise.cjs,
# read through lib/noise.glsl (NOISE_PATTERN=0 goes back to IGN).
texture.noise=textures/bluenoise.png
